<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
  <h1 style="color: #333;">Dashboard</h1>
  
  <button *ngIf="isOrganizer" routerLink="/create-event" style="padding: 10px 20px; background: #1E88E5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
    + Criar Evento
  </button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px;">
  <div *ngFor="let ev of events" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative;">
    
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <h3 style="margin-top: 0; color: #1E88E5; max-width: 75%;">{{ ev.title }}</h3>
      
      <div *ngIf="isOrganizer" style="display: flex; gap: 10px;">
        <a [routerLink]="['/edit-event', ev.id]" style="cursor: pointer; font-size: 1.2rem; text-decoration: none;" title="Editar">
          ✏️
        </a>
        <button (click)="deleteEvent(ev)" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;" title="Excluir">
          🗑️
        </button>
      </div>
    </div>

    <p style="color: #555; font-size: 0.9rem; margin: 10px 0;">{{ ev.description }}</p>
    
    <div style="color: #888; font-size: 0.85rem; margin-top: 15px;">
      <p>📅 {{ ev.startAt | date:'dd/MM/yyyy HH:mm' }}</p>
      <p>📍 {{ ev.location }}</p>
    </div>

    <button (click)="openInvite(ev)" style="width: 100%; margin-top: 15px; padding: 8px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer;">
      🎟️ Ver Convite (QR Code)
    </button>
  </div>
</div>

<div *ngIf="events.length === 0" style="text-align: center; color: #999; margin-top: 50px;">
  <p>Nenhum evento encontrado.</p>
</div>

<div *ngIf="showInviteModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000;">
  <div style="background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 300px;">
    <h3 style="margin-top: 0; color: #333;">Convite Digital</h3>
    <p style="color: #666;">{{ selectedEventTitle }}</p>
    
    <img [src]="qrCodeUrl" alt="QR Code" style="margin: 15px 0; border: 1px solid #eee; padding: 5px;">
    
    <p style="font-size: 0.8rem; color: #999;">Apresente este código na entrada.</p>
    
    <button (click)="closeModal()" style="padding: 8px 20px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer;">
      Fechar
    </button>
  </div>
</div>
